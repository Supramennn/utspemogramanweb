<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menu — Perpustakaan Mini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="css/styles.css?v=7" />
</head>

<body class="bg-slate text-light">
    <!-- login.js HARUS di-load duluan — menyediakan requireAuth() dan logout() -->
    <script src="js/login.js"></script>

    <nav class="navbar navbar-dark glass border-bottom">
        <div class="container">
            <span class="navbar-brand fw-bold">📚 Perpustakaan Mini</span>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
        </div>
    </nav>

    <main class="container py-5">
        <div class="text-center mb-4">
            <h1 class="fw-extrabold">Menu</h1>
            <p class="text-secondary">Pilih mau ke mana.</p>
            <div class="text-secondary small" id="welcome"></div>
        </div>

        <div class="row g-3 justify-content-center">
            <div class="col-12 col-md-5">
                <div class="card feature-card lift-on-hover h-100">
                    <div class="card-body">
                        <h4 class="fw-bold">Dashboard</h4>
                        <p class="text-secondary">Masuk ke katalog buku + live search + status peminjaman.</p>
                        <a class="btn btn-info fw-bold" href="dashboard.html">Masuk Dashboard →</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-5">
                <div class="card feature-card lift-on-hover h-100">
                    <div class="card-body">
                        <h4 class="fw-bold">Hak Akses</h4>
                        <p class="text-secondary" id="roleDesc"></p>
                        <div class="text-secondary small">
                            Admin: bisa toggle status (Pinjam/Kembalikan).<br />
                            User: hanya bisa melihat katalog.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        /**
         * MenuPage — mengelola tampilan & interaksi halaman menu
         * FIX: clearAuth() → logout() dari login.js
         */
        class MenuPage {
            constructor() {
                // requireAuth() dari login.js — redirect ke login jika belum login
                this.user = requireAuth("login.html");
                if (!this.user) return;

                this._render();
                this._bindEvents();
            }

            _render() {
                const { user } = this;

                document.getElementById("welcome").textContent =
                    `Login sebagai: ${user.username} (role: ${user.role})`;

                document.getElementById("roleDesc").textContent = (user.role === "admin")
                    ? "Kamu admin — bisa ubah status buku."
                    : "Kamu user biasa — mode lihat aja (read-only).";
            }

            _bindEvents() {
                // FIX: pakai logout() dari login.js — clearAuth() tidak pernah ada
                document.getElementById("logoutBtn").addEventListener("click", () => logout());
            }
        }

        // Inisialisasi setelah DOM siap
        document.addEventListener("DOMContentLoaded", () => {
            new MenuPage();
        });
    </script>
</body>

</html>
