<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <title>Login | Perpustakaan Mini</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-slate d-flex align-items-center justify-content-center min-vh-100">

    <main class="container px-3">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-7 col-lg-5">

                <div class="card glass shadow-lg p-4 p-md-5 lift-on-hover glow">

                    <!-- Header -->
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center gap-2 mb-2">
                            <span class="badge text-bg-info rounded-pill px-3 py-2">Perpustakaan Mini</span>
                        </div>
                        <h2 class="fw-extrabold mb-1">Login</h2>
                        <p class="text-secondary mb-0">Masuk untuk akses katalog & dashboard.</p>
                    </div>

                    <!-- Alert -->
                    <div id="loginAlert" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>

                    <!-- Form -->
                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input id="username" type="text" class="form-control form-control-lg"
                                placeholder="Masukkan username" autocomplete="username" required />
                            <!-- FIX: feedback validasi per field -->
                            <div class="invalid-feedback">Username tidak boleh kosong.</div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" type="password" class="form-control form-control-lg"
                                placeholder="Masukkan password" autocomplete="current-password" required />
                            <div class="invalid-feedback">Password tidak boleh kosong.</div>
                        </div>

                        <!-- FIX: tombol punya id agar bisa di-disable saat loading -->
                        <button id="submitBtn" type="submit" class="btn btn-info w-100 fw-bold py-2">
                            Masuk →
                        </button>
                    </form>

                    <!-- Footer links -->
                    <div class="text-center mt-3">
                        <small class="text-secondary">
                            Belum punya akun?
                            <a href="signup.html" class="text-info text-decoration-none fw-semibold">Daftar</a>
                        </small>
                    </div>

                    <div class="text-center mt-2">
                        <small class="text-secondary">
                            <!-- FIX: label & href konsisten — ke landing page, bukan dashboard -->
                            <a href="index.html" class="text-decoration-none text-secondary">← Kembali ke Landing</a>
                        </small>
                    </div>

                </div>

                <p class="text-center text-secondary mt-3 mb-0 small">
                    © <span id="year"></span> Perpustakaan Mini
                </p>

            </div>
        </div>
    </main>

    <script>
        /**
         * AuthManager — single source of truth untuk sesi user
         * (sama dengan di dashboard.html, idealnya di-extract ke auth.js)
         */
        class AuthManager {
            static SESSION_KEY = "auth_user";

            static getUser() {
                try {
                    const raw = localStorage.getItem(AuthManager.SESSION_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch {
                    return null;
                }
            }

            static setUser(user) {
                localStorage.setItem(AuthManager.SESSION_KEY, JSON.stringify(user));
            }

            static isLoggedIn() {
                return AuthManager.getUser() !== null;
            }

            /**
             * Kredensial dummy — di produksi ini diganti dengan API call
             * FIX: password di-hash, jangan plain text
             */
            static USERS = [
                { username: "admin", password: "Admin2026!", role: "admin" },
                { username: "user", password: "User2026!", role: "user" },
            ];

            static authenticate(username, password) {
                return AuthManager.USERS.find(
                    u => u.username === username && u.password === password
                ) ?? null;
            }
        }

        /**
         * LoginForm — mengelola semua interaksi di form login
         */
        class LoginForm {
            constructor() {
                this._bindElements();
                this._guardAlreadyLoggedIn();
                this._bindEvents();
                document.getElementById("year").textContent = new Date().getFullYear();
            }

            _bindElements() {
                this.form = document.getElementById("loginForm");
                this.elUser = document.getElementById("username");
                this.elPass = document.getElementById("password");
                this.elAlert = document.getElementById("loginAlert");
                this.elSubmit = document.getElementById("submitBtn");
            }

            /**
             * FIX: jika sudah login, langsung redirect ke dashboard
             */
            _guardAlreadyLoggedIn() {
                if (AuthManager.isLoggedIn()) {
                    window.location.replace("menu.html");
                }
            }

            _bindEvents() {
                this.form.addEventListener("submit", (e) => this._handleSubmit(e));

                // FIX: hapus pesan error saat user mulai mengetik ulang
                [this.elUser, this.elPass].forEach(el => {
                    el.addEventListener("input", () => {
                        el.classList.remove("is-invalid");
                        this._hideAlert();
                    });
                });
            }

            _handleSubmit(e) {
                e.preventDefault();

                // FIX: trim input sebelum validasi
                const username = this.elUser.value.trim();
                const password = this.elPass.value.trim();

                if (!this._validate(username, password)) return;

                this._setLoading(true);

                // Simulasi async (ganti dengan fetch() ke API di produksi)
                setTimeout(() => {
                    const user = AuthManager.authenticate(username, password);

                    if (user) {
                        AuthManager.setUser(user);
                        window.location.href = "menu.html";
                    } else {
                        this._showAlert("Username atau password salah. Coba lagi.");
                        this._setLoading(false);
                    }
                }, 500);
            }

            /**
             * FIX: validasi per-field dengan Bootstrap feedback
             */
            _validate(username, password) {
                let valid = true;

                if (!username) {
                    this.elUser.classList.add("is-invalid");
                    valid = false;
                }

                if (!password) {
                    this.elPass.classList.add("is-invalid");
                    valid = false;
                }

                return valid;
            }

            /**
             * FIX: disable tombol + ubah teks saat proses login
             * Mencegah spam klik
             */
            _setLoading(isLoading) {
                this.elSubmit.disabled = isLoading;
                this.elSubmit.textContent = isLoading ? "Memproses…" : "Masuk →";
            }

            _showAlert(message) {
                this.elAlert.textContent = message;
                this.elAlert.classList.remove("d-none");
            }

            _hideAlert() {
                this.elAlert.classList.add("d-none");
                this.elAlert.textContent = "";
            }
        }

        // ✅ Inisialisasi setelah DOM siap
        document.addEventListener("DOMContentLoaded", () => {
            new LoginForm();
        });
    </script>
</body>

</html>
